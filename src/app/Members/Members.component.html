<!-- Start Page Title Area -->
<section class="organaization-area ptb-100">
<div class="page-title-area ">
  <div class="container">
      <div class="page-title-content">
          <h2>مجلس الأمناء</h2>
          <ul>
              <li>
                  <a routerLink="/">الرئيسية

                      <i class="fa fa-chevron-right"></i>
                  </a>
              </li>
              <li>أعضاء المؤسسة</li>
          </ul>
      </div>
  </div>
</div>
<!-- End Page Title Area -->

<!-- Start Members Area -->
<section class="board">
  <div class="container">

    <!-- رئيس المجلس -->
    <article class="chair" *ngIf="Chair" arpReveal>
      <div class="portrait" arpReveal="mask">
        <img [src]="Chair.imageSrc" [alt]="Chair.memberName">
      </div>
      <div class="info">
        <p class="arp-label">{{ Chair.memberPosition }}</p>
        <h2>{{ Chair.memberName }}</h2>
        <p class="note">يقود مجلس الأمناء رسالة المؤسسة في الإسهام الحضاري بتطوير مجالات التنمية الاجتماعية ودعم العمل الخيري.</p>
        <div class="links">
          <a class="arp-link" routerLink="/CEOSpeech">كلمة رئيس المجلس <i class="fa fa-arrow-left"></i></a>
          <a class="arp-link soft" routerLink="/OrganizationChart">الهيكل التنظيمي <i class="fa fa-arrow-left"></i></a>
        </div>
      </div>
      <img class="mark" src="assets/img/Logo.png" alt="">
    </article>

    <!-- بقية الأعضاء -->
    <div class="head" *ngIf="Others.length" arpReveal>
      <p class="arp-label">أعضاء المجلس</p>
      <span class="count">{{ Members.length }} أعضاء</span>
    </div>
    <div class="grid">
      <figure class="member" *ngFor="let member of Others; let i = index" arpReveal [arpRevealDelay]="(i % 3) * 110">
        <div class="photo">
          <img [src]="member.imageSrc" [alt]="member.memberName" loading="lazy">
        </div>
        <figcaption>
          <b>{{ member.memberName }}</b>
          <span>{{ member.memberPosition }}</span>
        </figcaption>
      </figure>
    </div>

  </div>
</section>
</section>
