<!-- Start Page Title Area -->
<section class="organaization-area ptb-100">
<div class="page-title-area ">
  <div class="container">
    <div class="page-title-content">
      <h2>المعرض</h2>
      <ul>
        <li>
          <a routerLink="/">الرئيسية

            <i class="fa fa-chevron-right"></i>
          </a>
        </li>
        <li>معرض الفيديوهات</li>
      </ul>
    </div>
  </div>
</div>
<!-- End Page Title Area -->

<!-- Start Videos Area -->
<section class="videos">
  <div class="container">
    <div class="grid">
      <figure class="item" *ngFor="let Video of listVideo |
        paginate: {id: 'listing_pagination',
        itemsPerPage: 6,
        currentPage: page,
        totalItems: tatalRecords}; let i = index" arpReveal [arpRevealDelay]="(i % 3) * 100">
        <!-- لا يُحمَّل الفيديو إلا عند الضغط على التشغيل -->
        <app-lazy-video [src]="Video.VideoSrc" [title]="'فيديو من أعمال المؤسسة ' + (videoDate(Video) || '')" [showTitle]="false"></app-lazy-video>
        <figcaption *ngIf="videoDate(Video)"><i class="far fa-calendar"></i> {{ videoDate(Video) }}</figcaption>
      </figure>
    </div>

    <pagination-controls id='listing_pagination' [maxSize]="5" [directionLinks]="true"
      [autoHide]="true"
      [responsive]="true"
      previousLabel="السابق"
      nextLabel="التالي"
      screenReaderPaginationLabel="الصفحات"
      screenReaderPageLabel="الصفحة" (pageChange)="page = $event"></pagination-controls>
  </div>
</section>
</section>
